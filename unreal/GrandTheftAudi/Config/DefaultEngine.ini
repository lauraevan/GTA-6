[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/GrandTheftAudi.GTAGameMode

[/Script/Engine.RendererSettings]
; Lumen GI + reflections (the "RAGE-like" real-time bounce lighting)
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
r.Lumen.Reflections.HardwareRayTracing=True
; Nanite for the Higgsfield high-poly meshes
r.Nanite.ProjectEnabled=True
; Temporal Super Resolution (smooth AAA anti-aliasing / upscaling)
r.AntiAliasingMethod=4
r.TSR.History.ScreenPercentage=200
; cinematic post defaults
r.DefaultFeature.Bloom=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AutoExposure=True
r.SkinCache.CompileShaders=True
r.RayTracing=True

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000

[/Script/ChaosVehiclesPlugin.ChaosVehicleSettings]
; defaults are fine — tuning lives on the vehicle pawn

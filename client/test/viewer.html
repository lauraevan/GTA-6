<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script type="importmap">
    { "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/" } }
  </script>
  <style>body{margin:0;background:#607080}</style>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  const params = new URLSearchParams(location.search);
  const model = params.get('m') || 'vehicle-falke';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#607080');
  const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.4));
  const dir = new THREE.DirectionalLight(0xffffff, 1.6);
  dir.position.set(3, 6, 4);
  scene.add(dir);
  // axis rig: red = +X, blue = +Z (game forward). Big blue arrow marks +Z.
  scene.add(new THREE.AxesHelper(2.5));
  const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 0), 3, 0x2244ff, 0.5, 0.3);
  scene.add(arrow);
  scene.add(new THREE.GridHelper(8, 8, 0x99aabb, 0x8090a0));

  new GLTFLoader().load(`/public/models/${model}.glb`, (gltf) => {
    const root = gltf.scene;
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const scale = 4 / Math.max(size.x, size.y, size.z);
    root.scale.setScalar(scale);
    const box2 = new THREE.Box3().setFromObject(root);
    const c = box2.getCenter(new THREE.Vector3());
    root.position.sub(c).setY(root.position.y - box2.min.y);
    scene.add(root);
    window.__DIMS = { x: +size.x.toFixed(2), y: +size.y.toFixed(2), z: +size.z.toFixed(2) };
    // camera: high 3/4 from +X +Z quadrant
    cam.position.set(4.5, 3.2, 4.5);
    cam.lookAt(0, 0.6, 0);
    renderer.render(scene, cam);
    window.__READY = true;
  }, undefined, (e) => { window.__ERR = String(e); window.__READY = true; });
</script>
</body>
</html>

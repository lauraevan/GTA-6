# Downloads the Higgsfield-generated GLB assets (CDN is unreachable from the
# authoring sandbox) and commits them to the branch that dispatched the run.
name: fetch-assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download GLB assets
        run: bash scripts/fetch-assets.sh
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/public/models/*.glb
          if git diff --cached --quiet; then
            echo "assets already committed"
          else
            git commit -m "assets: add Higgsfield-generated GLB models (falke, cruiser, thunder, kurier, rigged ped)"
            git push
          fi
